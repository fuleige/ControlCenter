services:
  control-plane:
    build:
      context: ..
      dockerfile: apps/control-plane/Dockerfile
    restart: unless-stopped
    environment:
      CONTROL_HOST: 0.0.0.0
      CONTROL_PORT: 8787
      CONTROL_DATA_DIR: /data
      AGENT_ARTIFACT_DIR: ${AGENT_ARTIFACT_DIR:-/workspace/artifacts}
      AGENT_SHARED_TOKEN: ${AGENT_SHARED_TOKEN:?set AGENT_SHARED_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      PUBLIC_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "true"
      NODE_FILES_QUOTA_BYTES: ${NODE_FILES_QUOTA_BYTES:-8589934592}
      NODE_FILES_DISK_RESERVE_BYTES: ${NODE_FILES_DISK_RESERVE_BYTES:-536870912}
      NODE_TERMINAL_LIMIT: ${NODE_TERMINAL_LIMIT:-8}
      NODE_FILE_CONCURRENCY: ${NODE_FILE_CONCURRENCY:-2}
    volumes:
      - control-data:/data
    expose:
      - "8787"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_CONTROL_API_URL:-}
    restart: unless-stopped
    depends_on:
      - control-plane
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  control-data:
