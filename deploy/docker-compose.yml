services:
  control-plane:
    build:
      context: ..
      dockerfile: apps/control-plane/Dockerfile
    restart: unless-stopped
    environment:
      CONTROL_HOST: 0.0.0.0
      CONTROL_PORT: 8787
      CONTROL_DATA_DIR: /data
      AGENT_SHARED_TOKEN: ${AGENT_SHARED_TOKEN:?set AGENT_SHARED_TOKEN}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      PUBLIC_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: "true"
    volumes:
      - control-data:/data
    expose:
      - "8787"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${PUBLIC_CONTROL_API_URL:-}
    restart: unless-stopped
    depends_on:
      - control-plane
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  control-data:
